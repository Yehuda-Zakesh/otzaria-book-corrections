name: Publish GitHub release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa:
    uses: ./.github/workflows/ci.yml
  release:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check release tag matches the manifest
        run: node scripts/release-version.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: book-corrections-${{ github.sha }}
          path: dist
      - name: Publish validated installation file
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.qa.outputs.version }}
        run: |
          gh release create "v$VERSION" "dist/book-corrections-$VERSION.otzplugin" --target "$GITHUB_SHA" --title "תיקוני ספרים $VERSION" --generate-notes
